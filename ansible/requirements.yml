---
# Kept as a record of what the playbooks actually need. It is NOT installed by
# `make bootstrap` — Arch's `ansible` package already bundles all of these above
# these versions. Verify with: ansible-galaxy collection list
collections:
  # virt_pool / virt_net modules used by the libvirt role
  - name: community.libvirt
    version: ">=1.3.0"
  # postgresql_db / postgresql_user used by the forgejo role
  - name: community.postgresql
    version: ">=3.4.0"
  - name: community.general
    version: ">=9.0.0"
  - name: ansible.posix
    version: ">=1.5.0"
