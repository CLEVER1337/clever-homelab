---
# Caddy signs git.homelab.lan with a CA it generated itself, so to everything on
# this guest that certificate is issued by an unknown authority. Without the
# root installed here the runner cannot poll the instance at all, and a job's
# `actions/checkout` fails on the clone.
#
# The root is copied from the Forgejo guest rather than pointed at over the
# network: Caddy never serves it, and fetching a CA over the connection it is
# supposed to authenticate would be pointless anyway.

# Caddy writes its local CA the first time it provisions TLS, which is moments
# after the service starts rather than at install time — hence the retries.
- name: Wait for Caddy's local CA
  ansible.builtin.stat:
    path: "{{ forgejo_runner_ca_src }}"
  delegate_to: "{{ forgejo_runner_server_host }}"
  register: forgejo_runner_ca_stat
  until: forgejo_runner_ca_stat.stat.exists
  retries: 12
  delay: 5

- name: Read the root certificate
  ansible.builtin.slurp:
    src: "{{ forgejo_runner_ca_src }}"
  delegate_to: "{{ forgejo_runner_server_host }}"
  register: forgejo_runner_ca_raw

- name: Install the root certificate
  ansible.builtin.copy:
    dest: "{{ forgejo_runner_ca_dest }}"
    content: "{{ forgejo_runner_ca_raw.content | b64decode }}"
    owner: root
    group: root
    mode: "0644"
  register: forgejo_runner_ca_installed
  notify: Restart forgejo-runner

# `update-ca-certificates` is what actually folds the file above into
# /etc/ssl/certs/ca-certificates.crt, which is the bundle the runner reads —
# and the one bind-mounted into every job container by the config's
# `container.options`.
- name: Rebuild the system trust store
  ansible.builtin.command: update-ca-certificates
  when: forgejo_runner_ca_installed is changed
  changed_when: true
