---
# The application's credentials, as Kubernetes Secrets in its namespace.
#
# This exists so that the deploy pipeline never handles a password. The manifests
# repository used to generate these Secrets itself with kustomize, from env files
# that had to be present at `kustomize build` time — which would have meant every
# database password living in Forgejo's Actions secrets, and therefore in the
# environment of the one guest that runs code nobody reviewed.
#
# Ansible already holds all of it. Three of the six passwords are generated by
# the database roles and never leave those guests; the other three belong to the
# application and are generated here. So the pipeline's only credential is the
# namespace-scoped kubeconfig, and rotating a database password is `make
# configure` rather than an edit in a web UI.
#
# The cost is that these Secrets have fixed names with no content hash, so
# changing one does not roll the pods that mount it. `make restart` in the
# manifests repository is the other half of a rotation.

# --- what the database guests generated ---------------------------------------
# Read straight off each guest rather than through hostvars: a `--limit` that
# excludes the database plays would leave those facts unset, and the failure
# would be a Secret quietly written with an empty password.
- name: Read the database passwords from their guests
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  delegate_to: "{{ item.host }}"
  register: k3s_app_db_passwords
  no_log: true
  # Paths are built from each guest's own hostvars, not from this host's: none of
  # db_secret_dir, pg_app_user or clickhouse_app_user are defined for a k3s node,
  # and hardcoding them here is how the two halves drift apart.
  loop:
    - key: postgres
      host: "{{ groups['postgres'] | first }}"
      path: >-
        {{ hostvars[groups['postgres'] | first].db_secret_dir }}/pg_{{
           hostvars[groups['postgres'] | first].pg_app_user }}_password
    - key: clickhouse
      host: "{{ groups['clickhouse'] | first }}"
      path: >-
        {{ hostvars[groups['clickhouse'] | first].db_secret_dir }}/clickhouse_{{
           hostvars[groups['clickhouse'] | first].clickhouse_app_user }}_password
    - key: elasticsearch
      host: "{{ groups['elasticsearch'] | first }}"
      path: "{{ hostvars[groups['elasticsearch'] | first].db_secret_dir }}/elasticsearch_app_password"
  loop_control:
    label: "{{ item.key }} from {{ item.host }}"

- name: Note the database passwords
  ansible.builtin.set_fact:
    k3s_app_passwords: >-
      {{ dict(k3s_app_db_passwords.results
              | map(attribute='item.key')
              | zip(k3s_app_db_passwords.results
                    | map(attribute='content')
                    | map('b64decode') | map('trim'))) }}
  no_log: true

# --- what belongs to the application ------------------------------------------
# Redis and the JWT key have no guest of their own — Redis runs in the cluster
# and the signing key is not infrastructure at all. Generated here, once, with
# the same `creates:` guard every other password in this repository uses: a
# re-run must never roll a key out from under a running service.
#
# The JWT key in particular: identity mints with it and four other services
# validate against it. Rotating it invalidates every token in the wild, and a
# half-rolled namespace means new tokens rejected by old pods.
- name: Create the application secret directory
  ansible.builtin.file:
    path: "{{ k3s_app_secret_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the application's own secrets once
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ item.gen }} > {{ k3s_app_secret_dir }}/{{ item.file }}
      && chmod 0600 {{ k3s_app_secret_dir }}/{{ item.file }}
    creates: "{{ k3s_app_secret_dir }}/{{ item.file }}"
    executable: /bin/bash
  loop:
    # hex, not base64: this one is interpolated into a redis:// URL by the Python
    # services, and @ : / ? # % all have to be percent-encoded there. Staying
    # inside [0-9a-f] means the question never comes up.
    - { file: redis_password, gen: "openssl rand -hex 24 | tr -d '\\n'" }
    # HS256 wants at least 32 bytes; 48 raw gives 64 base64 characters.
    - { file: jwt_key, gen: "openssl rand -base64 48 | tr -d '\\n'" }
    - { file: grafana_admin_password, gen: "openssl rand -base64 24 | tr -d '\\n'" }
  loop_control:
    label: "{{ item.file }}"

- name: Read the application's own secrets
  ansible.builtin.slurp:
    src: "{{ k3s_app_secret_dir }}/{{ item }}"
  register: k3s_app_own_secrets
  no_log: true
  loop:
    - redis_password
    - jwt_key
    - grafana_admin_password

- name: Note the application's own secrets
  ansible.builtin.set_fact:
    k3s_app_own: >-
      {{ dict(k3s_app_own_secrets.results
              | map(attribute='item')
              | zip(k3s_app_own_secrets.results
                    | map(attribute='content')
                    | map('b64decode') | map('trim'))) }}
  no_log: true

# --- into the cluster ---------------------------------------------------------
- name: Write the application secret manifests
  ansible.builtin.template:
    src: app-secrets.yaml.j2
    dest: /etc/rancher/k3s/app-secrets.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Apply them
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f /etc/rancher/k3s/app-secrets.yaml
  register: k3s_app_secrets_applied
  changed_when: >-
    k3s_app_secrets_applied.stdout_lines | reject('search', 'unchanged$') | list | length > 0

- name: Report the application secrets
  ansible.builtin.debug:
    msg:
      - "Six Secrets in namespace {{ k3s_app_namespace }}: explained-{postgres,clickhouse,elasticsearch,redis,jwt,grafana}"
      - "The manifests repository references these by name and creates none of them,"
      - "so its deploy pipeline holds no password — only the kubeconfig."
      - "Application-side secrets are kept at {{ k3s_app_secret_dir }} on this node."
      - "Grafana admin: {{ k3s_app_grafana_user }} / (see {{ k3s_app_secret_dir }}/grafana_admin_password)"
