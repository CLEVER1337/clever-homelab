---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# After the package install above: Debian ships timesyncd as its own package,
# and the cloud image the guests are built from does not carry it.
- name: Keep the clock synchronised
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Check how the hardware clock is interpreted
  ansible.builtin.command: timedatectl show --property=LocalRTC --value
  register: common_local_rtc
  changed_when: false

# This box dual-boots, and Windows keeps the RTC in local time by default while
# systemd expects UTC. Left as it was, every Linux boot came up three hours off
# and then jumped backwards the moment timesyncd corrected it — visible in the
# journal as libvirtd starting at 16:00 and logging its next line at 13:02.
#
# Cosmetic until something records a timestamp in that window. Caddy signs its
# own certificates here, and one issued then carries a notBefore in the future
# and is refused; Elasticsearch would roll a daily index into the wrong day.
#
# NOT --adjust-system-clock. That flag sets the system clock *from* the RTC
# under the new interpretation, which would apply the wrong value we are trying
# to get rid of. Without it the sync runs the other way, and the RTC is written
# from the NTP-corrected system clock, which is the direction that fixes it.
#
# Windows has to agree, or it rewrites the RTC in local time on its next boot
# and the drift comes back. See README, "Dual-boot clock".
- name: Read the hardware clock as UTC
  ansible.builtin.command: timedatectl set-local-rtc 0
  when: common_local_rtc.stdout | trim == "yes"
  changed_when: true

# The task above fixes what the clock reads; this fixes who is allowed to run
# before it is right. They are different problems and the second one bit us.
#
# `After=time-sync.target` is inert on a stock Debian guest: nothing pulls that
# target in, so it is reached immediately and ordering against it means nothing.
# systemd-time-wait-sync is the unit that gives it meaning — it holds the target
# until timesyncd reports an actual synchronisation, so a service ordered after
# it starts with a trustworthy clock or does not start yet.
#
# Concretely: Caddy came up on the Forgejo guest six hours ahead after a reboot
# and minted an intermediate CA and three leaf certificates stamped notBefore in
# the future — one of them with a notAfter *earlier* than its notBefore. Nothing
# would talk to Forgejo over TLS afterwards, including the CI runner, whose only
# symptom was Forgejo reporting no runner with the `docker` label.
#
# Costs up to ~2 minutes of boot on a guest that cannot reach an NTP server.
# These reach one through the host's NAT, and a slow boot beats certificates
# that have to be deleted by hand.
- name: Hold boot until the clock is synchronised
  ansible.builtin.systemd:
    name: systemd-time-wait-sync
    enabled: true
    state: started

# cloud-init renders /etc/hosts from its own template on *every* boot when
# manage_etc_hosts is true, which the Debian cloud image ships as the default.
# Anything written into that file by hand or by Ansible survives exactly until
# the next reboot.
#
# That is not hypothetical either: the `git.homelab.lan` line the forgejo_access
# role adds is what lets the runner find Forgejo and what lets containerd on the
# k3s nodes pull images, and a reboot silently removed it from all four guests
# at once. There is no DNS on the guest network to fall back to — libvirt's
# dnsmasq hands out no leases, so /etc/hosts is the only name resolution these
# machines have, which is precisely why it must not be volatile.
#
# A drop-in rather than an edit to /etc/cloud/cloud.cfg: the package owns that
# file and an upgrade may replace it.
- name: Stop cloud-init from rewriting /etc/hosts
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-homelab-hosts.cfg
    content: |
      # {{ ansible_managed }}
      # /etc/hosts is the only name resolution on the guest network. Ansible
      # owns its contents; cloud-init must not regenerate it at boot.
      manage_etc_hosts: false
    owner: root
    group: root
    mode: "0644"

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Written as a drop-in rather than edits to sshd_config, so the distro file
# stays pristine and `apt` upgrades never generate a merge prompt.
- name: Install the disk capacity guard
  ansible.builtin.template:
    src: disk-guard.sh.j2
    dest: /usr/local/sbin/homelab-disk-guard
    mode: "0755"
    validate: bash -n %s

- name: Install the disk guard units
  ansible.builtin.template:
    src: "disk-guard.{{ item }}.j2"
    dest: "/etc/systemd/system/homelab-disk-guard.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  notify: Reload systemd

- name: Enable the disk guard timer
  ansible.builtin.systemd:
    name: homelab-disk-guard.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
