---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# One handler for both halves of the cluster. The unit names differ, and the
# role that installs the unit is always in the same play as this handler, so by
# the time handlers flush the service exists.
- name: Restart k3s
  ansible.builtin.systemd:
    name: "{{ 'k3s' if 'k3s_server' in group_names else 'k3s-agent' }}"
    state: restarted
