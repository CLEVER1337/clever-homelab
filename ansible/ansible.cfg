[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = True
interpreter_python   = auto_silent
# The old `yaml` stdout callback lived in community.general and was removed in
# its 12.0.0. Same output, now an option on the built-in callback.
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = ansible.posix.profile_tasks
retry_files_enabled  = False
forks                = 10

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
