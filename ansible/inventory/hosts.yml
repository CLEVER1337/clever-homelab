---
# Two tiers: the bare-metal box, and the guests living on it.
#
# The guests sit on a NAT-only libvirt network, so they are not routable from
# the laptop. Ansible reaches them by jumping through the hypervisor. That is
# deliberate: nothing but Caddy is exposed to the LAN.

all:
  vars:
    ansible_user: supervisor # <-- your login on the server, and inside the VMs

  children:
    hypervisors:
      hosts:
        homelab:
          ansible_host: 192.168.0.19 # <-- your Debian box

    # Everything Terraform builds. The jump-host settings live here rather than
    # on each group, so a new machine only needs its address.
    guests:
      vars:
        # Guests are rebuilt by Terraform and get a new host key each time, so
        # they are kept out of your personal known_hosts and trusted on first
        # use instead. The risk that buys is small: the only path to them runs
        # through the hypervisor, which is verified normally — forging a guest
        # key would mean already owning the host.
        #
        # After a rebuild the old key here will mismatch. Delete the file.
        ansible_ssh_common_args: >-
          -o ProxyJump={{ hostvars['homelab'].ansible_user }}@{{ hostvars['homelab'].ansible_host }}
          -o UserKnownHostsFile={{ inventory_dir }}/.known_hosts_guests
          -o StrictHostKeyChecking=accept-new

      children:
        forgejo:
          hosts:
            forgejo-vm:
              ansible_host: 10.42.0.10 # must match terraform vms.forgejo.ip

        # The CI runner. Its play in site.yml runs after the forgejo one and
        # reaches back into that guest to register itself, so a --limit that
        # keeps only this group works — but only once Forgejo is installed.
        runners:
          hosts:
            runner-vm:
              ansible_host: 10.42.0.11 # must match terraform vms.runner.ip

        # Same story: declared now, configured later. One group per engine,
        # because each gets its own role — the parent is here to hang shared
        # vars on (backup schedule, listen address) once there are any.
        databases:
          children:
            postgres:
              hosts:
                postgres-vm:
                  ansible_host: 10.42.0.20 # must match terraform vms.postgres.ip
            clickhouse:
              hosts:
                clickhouse-vm:
                  ansible_host: 10.42.0.21 # must match terraform vms.clickhouse.ip
            elasticsearch:
              hosts:
                elasticsearch-vm:
                  ansible_host: 10.42.0.22 # must match terraform vms.elasticsearch.ip

        # k3s. Split into server and agents because the join order matters: the
        # server has to be up and holding a node token before an agent can
        # register, so they cannot be one group the playbook runs in parallel.
        k3s:
          children:
            k3s_server:
              hosts:
                k3s-master:
                  ansible_host: 10.42.0.30 # must match terraform vms.k3s-master.ip
            k3s_agents:
              hosts:
                k3s-worker-1:
                  ansible_host: 10.42.0.31 # must match terraform vms.k3s-worker-1.ip
                k3s-worker-2:
                  ansible_host: 10.42.0.32 # must match terraform vms.k3s-worker-2.ip
