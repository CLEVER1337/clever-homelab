---
# Two tiers: the bare-metal box, and the guests living on it.
#
# The guests sit on a NAT-only libvirt network, so they are not routable from
# the laptop. Ansible reaches them by jumping through the hypervisor. That is
# deliberate: nothing but Caddy is exposed to the LAN.

all:
  vars:
    ansible_user: supervisor # <-- your login on the server, and inside the VMs

  children:
    hypervisors:
      hosts:
        homelab:
          ansible_host: 192.168.0.19 # <-- your Debian box

    # Everything Terraform builds. The jump-host settings live here rather than
    # on each group, so a new machine only needs its address.
    guests:
      vars:
        # Guests are rebuilt by Terraform and get a new host key each time, so
        # they are kept out of your personal known_hosts and trusted on first
        # use instead. The risk that buys is small: the only path to them runs
        # through the hypervisor, which is verified normally — forging a guest
        # key would mean already owning the host.
        #
        # After a rebuild the old key here will mismatch. Delete the file.
        ansible_ssh_common_args: >-
          -o ProxyJump={{ hostvars['homelab'].ansible_user }}@{{ hostvars['homelab'].ansible_host }}
          -o UserKnownHostsFile={{ inventory_dir }}/.known_hosts_guests
          -o StrictHostKeyChecking=accept-new

      children:
        forgejo:
          hosts:
            forgejo-vm:
              ansible_host: 10.42.0.10 # must match terraform vms.forgejo.ip

        # Declared ahead of the role that configures it. No play in site.yml
        # targets this group yet, so `make configure` ignores it — deliberately,
        # because the machine does not exist until the next `terraform apply`
        # and a play pointing at a missing host would fail every run.
        runners:
          hosts:
            runner-vm:
              ansible_host: 10.42.0.11 # must match terraform vms.runner.ip
