---
# The project's PostgreSQL. Not to be confused with the one the forgejo role
# installs on the Forgejo VM for Forgejo's own use — that one stays where it
# is, so losing this machine cannot take the git server down with it.

# Debian 13 ships 17 as `postgresql`. Pinned by major version because the data
# directory path contains it and an unattended major upgrade does not migrate.
pg_version: 17

# One server, several databases. explAIned is a set of microservices and each
# owns its own schema — sharing one would be the thing its architecture is built
# to avoid — but they share a server, because four Postgres instances on a 3 GB
# guest buys an isolation nobody asked for at a price this machine cannot pay.
#
# Named for what each service stores: identity's accounts, articles, comments,
# profiles. These have to match the `Database=` in each service's connection
# string exactly — nothing discovers them.
#
# Set these before the first run. A database is created once and this role will
# not rename one afterwards. Adding an entry later is fine and creates only the
# new one; *changing* an entry creates an empty database under the new name and
# leaves the old one sitting there with all the data still in it. Renaming is a
# manual ALTER DATABASE against the running server, and only then an edit here.
pg_app_databases:
  - users
  - articles
  - comments
  - profiles

# A single owner for all four. The services never connect to each other's
# databases, so per-database roles would add key management without adding a
# boundary anything actually crosses.
pg_app_user: app

# --- tuning for a 3 GB machine ------------------------------------------------
# Defaults assume a far larger box. The two that matter most:
#
# shared_buffers is Postgres' own cache, conventionally a quarter of RAM. Going
# higher is counterproductive here because the same pages then sit in both this
# and the kernel page cache, and on a 3 GB guest that duplication is expensive.
#
# effective_cache_size caches nothing — it tells the planner how much cache it
# can expect between Postgres and the kernel, which decides index scan versus
# sequential scan. Too low and it stops using indexes it should.
pg_shared_buffers: 768MB
pg_effective_cache_size: 2GB

# Per sort or hash node, not per connection — one query can use several at once.
# 8 MB against max_connections of 100 is a worst case well beyond RAM, which is
# why the connection count is capped low rather than left at the default.
pg_work_mem: 8MB
pg_maintenance_work_mem: 192MB
pg_max_connections: 100

# The application connects through a pool; this is not the number of clients.
# Raising it is usually the wrong fix — add a pooler instead.
