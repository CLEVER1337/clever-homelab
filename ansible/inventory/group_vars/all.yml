---
timezone: Europe/Moscow

# Packages every machine gets, bare metal and guests alike.
common_packages:
  - curl
  - git
  - htop
  - rsync
  - vim
  - ca-certificates
  # Its own package on Debian, and absent from the guests' cloud image. The
  # hypervisor's clock is corrected against it after every boot — see the RTC
  # comment in roles/common/tasks/main.yml.
  - systemd-timesyncd

# sshd hardening applied everywhere. Password auth off is the point of it;
# make sure your key works before the first run finishes.
ssh_permit_root_login: "no"
ssh_password_authentication: "no"

# Pod network of the k3s cluster. Here rather than in group_vars/k3s.yml
# because the database guests need it for their connection allow-lists, and
# they are not in the k3s group. Changing it means rebuilding the cluster —
# see the comment in group_vars/k3s.yml.
k3s_cluster_cidr: 10.44.0.0/16

# Root filesystem usage at which the daily guard marks its unit failed.
# The hypervisor only has a 79 GB root and guest disks are thin, so their
# ceilings sum to more than exists — 80% leaves room to react.
disk_guard_percent: 80
